[package]
name = "vtuber-subtitle-app"
version = "1.0.0"
description = "Real-time OBS AI Subtitle & Live Translator for VTubers (TH / JP / EN)"
authors = ["VTuber Engineering Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
